<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orangeGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- UI Component Gradients -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a364f" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#161f30" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111724" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c101a" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.6" />
    </filter>
    <filter id="neonOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1400" height="480" rx="16" fill="url(#bgGradient)" />
  <rect width="1400" height="480" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <rect width="1400" height="480" fill="url(#cyanGlow)" />
  <rect width="1400" height="480" fill="url(#orangeGlow)" />
  <rect width="1400" height="480" fill="url(#emeraldGlow)" />

  <!-- Outer Border -->
  <rect width="1398" height="478" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- ==================== LEFT SECTION: BRANDING & SPEC ==================== -->
  <g transform="translate(80, 68)">
    <!-- Architecture Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="280" height="30" rx="15" fill="#131d2e" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" filter="url(#neonCyan)" />
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PURE RUST · ZERO PYTHON</text>
    </g>

    <!-- Main Title: JEV OBSCURA BROWSER -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'SF Pro Display', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#textGrad)">
        JEV OBSCURA <tspan fill="#f97316">BROWSER</tspan>
      </text>
    </g>

    <!-- Subtitle: Obscura × TypeSafe -->
    <g transform="translate(0, 114)">
      <rect width="210" height="32" rx="8" fill="#161f30" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="700" fill="#22d3ee">Obscura</text>
      <text x="82" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="600" fill="#94a3b8">×</text>
      <text x="102" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="700" fill="#fb923c">TypeSafe</text>
      <circle cx="190" cy="16" r="3" fill="#10b981" />
    </g>

    <!-- Tagline -->
    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
      Fast speculative browser automation in pure Rust
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: 1-RTT Fan-Out -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
          <tspan fill="#06b6d4">⚡</tspan> 1-RTT Speculative Loop
        </text>
      </g>

      <!-- Badge 2: Async WebSocket CDP -->
      <g transform="translate(254, 0)">
        <rect width="240" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
          <tspan fill="#10b981">🔌</tspan> Multiplexed CDP Client
        </text>
      </g>

      <!-- Badge 3: SHA-256 Fingerprint -->
      <g transform="translate(0, 52)">
        <rect width="240" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
          <tspan fill="#f97316">🛡️</tspan> SHA-256 DOM Integrity
        </text>
      </g>

      <!-- Badge 4: Axum Web Inspector -->
      <g transform="translate(254, 52)">
        <rect width="240" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
          <tspan fill="#a855f7">📊</tspan> Axum Inspector (:8766)
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT SECTION: BROWSER & SPECULATIVE MOCKUP ==================== -->
  <g transform="translate(680, 52)" filter="url(#shadow)">
    <!-- Browser Frame Window -->
    <rect width="640" height="376" rx="14" fill="url(#windowBg)" stroke="url(#windowBorder)" stroke-width="1.6" />

    <!-- Browser Header / Title Bar -->
    <rect width="640" height="44" rx="14" fill="#141c2c" />
    <rect width="640" height="1" y="44" fill="#243046" />

    <!-- Window Dots -->
    <circle cx="22" cy="22" r="5" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="38" cy="22" r="5" fill="#f59e0b" fill-opacity="0.85" />
    <circle cx="54" cy="22" r="5" fill="#10b981" fill-opacity="0.85" />

    <!-- URL Bar -->
    <rect x="76" y="10" width="460" height="24" rx="6" fill="#0c121e" stroke="#232f42" stroke-width="1" />
    <text x="90" y="26" font-family="monospace" font-size="11" fill="#06b6d4" font-weight="500">
      https://obscura.sh<tspan fill="#64748b">/agent/live</tspan>
    </text>
    <text x="400" y="26" font-family="monospace" font-size="9.5" fill="#475569">
      [sha256: 7f8a9e...]
    </text>

    <!-- Obscura Status Pill -->
    <rect x="548" y="10" width="76" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
    <text x="559" y="26" font-family="monospace" font-size="10.5" fill="#34d399" font-weight="700">CDP LIVE</text>

    <!-- Browser Content Body -->
    <g transform="translate(24, 60)">
      <!-- Goal Ribbon -->
      <rect width="592" height="32" rx="6" fill="#1a2336" stroke="#2a3952" stroke-width="0.8" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11.5" fill="#94a3b8">
        <tspan fill="#38bdf8" font-weight="700">GOAL:</tspan> "Select Zurich → London outbound flight on Sep 20"
      </text>

      <!-- Indexed Candidate Elements -->
      <!-- Candidate 1: [e1] Departure combobox -->
      <g transform="translate(0, 44)">
        <rect width="288" height="60" rx="8" fill="#111928" stroke="#1f2d42" stroke-width="1" />
        <!-- Index Badge -->
        <rect x="10" y="10" width="34" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="15" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">[e1]</text>
        <text x="52" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Departure Airport</text>
        <rect x="12" y="34" width="264" height="18" rx="4" fill="#0b101c" stroke="#1e293b" stroke-width="0.6" />
        <text x="20" y="46" font-family="monospace" font-size="10" fill="#38bdf8">ZRH (Zurich Airport)</text>
      </g>

      <!-- Candidate 2: [e2] Destination combobox -->
      <g transform="translate(304, 44)">
        <rect width="288" height="60" rx="8" fill="#111928" stroke="#1f2d42" stroke-width="1" />
        <!-- Index Badge -->
        <rect x="10" y="10" width="34" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="15" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">[e2]</text>
        <text x="52" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Destination Airport</text>
        <rect x="12" y="34" width="264" height="18" rx="4" fill="#0b101c" stroke="#1e293b" stroke-width="0.6" />
        <text x="20" y="46" font-family="monospace" font-size="10" fill="#38bdf8">LHR (London Heathrow)</text>
      </g>

      <!-- Candidate 3: [e7] High-Speed Decision Winning Candidate -->
      <g transform="translate(0, 116)">
        <rect width="592" height="74" rx="8" fill="#141a29" stroke="#ea580c" stroke-width="1.8" filter="url(#neonOrange)" />
        
        <!-- Element Label & Badge -->
        <rect x="12" y="12" width="36" height="22" rx="4" fill="#ea580c" />
        <text x="18" y="27" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">[e7]</text>

        <text x="58" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
          button "Select SWISS LX318 07:15 - £142"
        </text>

        <!-- Speculative Decision Evaluation Result -->
        <rect x="12" y="42" width="568" height="24" rx="4" fill="#1f1824" stroke="#7c2d12" stroke-width="0.8" />
        <text x="20" y="58" font-family="monospace" font-size="10.5" fill="#fdba74">
          ▶ Operation: <tspan fill="#4ade80" font-weight="700">CLICK</tspan> | Target: <tspan fill="#f97316" font-weight="700">[e7]</tspan> | Prob: <tspan fill="#38bdf8">0.998</tspan> | 1 RTT Speculative
        </text>

        <!-- Target Pointer Vector -->
        <polygon points="556,22 570,30 556,38" fill="#f97316" />
      </g>

      <!-- Flow Vector & Decision HUD -->
      <g transform="translate(0, 204)">
        <rect width="592" height="88" rx="8" fill="#0a0f19" stroke="#1b263b" stroke-width="1" />

        <!-- Decision Tree Visual -->
        <text x="14" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">
          SPECULATIVE FAN-OUT:
        </text>

        <!-- Branch 1: CLICK head (Chosen) -->
        <rect x="14" y="32" width="180" height="46" rx="6" fill="#1c281e" stroke="#10b981" stroke-width="1.2" />
        <text x="24" y="49" font-family="monospace" font-size="11" font-weight="700" fill="#4ade80">● CLICK_TARGET</text>
        <text x="24" y="66" font-family="monospace" font-size="10" fill="#a7f3d0">[e7] SWISS LX318 (✓)</text>

        <!-- Branch 2: TYPE_TEXT head (Speculative) -->
        <rect x="206" y="32" width="180" height="46" rx="6" fill="#111624" stroke="#25354e" stroke-width="1" />
        <text x="216" y="49" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">○ TYPE_TARGET</text>
        <text x="216" y="66" font-family="monospace" font-size="10" fill="#475569">[e1] skipped (speculative)</text>

        <!-- Branch 3: WAIT head (Speculative) -->
        <rect x="398" y="32" width="180" height="46" rx="6" fill="#111624" stroke="#25354e" stroke-width="1" />
        <text x="408" y="49" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">○ WAIT_TARGET</text>
        <text x="408" y="66" font-family="monospace" font-size="10" fill="#475569">threshold &lt; 0.001</text>
      </g>
    </g>
  </g>
</svg>
